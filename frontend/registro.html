<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — Sistema de Pedidos</title>
    <link rel="stylesheet" href="assets/css/registro.css">
</head>

<body>

    <main class="login-container">

        <section class="register-card">

            <h1>Crear Cuenta</h1>
            <p class="register-subtitle">Registrate como empleado para realizar y gestionar tus pedidos de almuerzo.</p>

            <div class="role-notice">
                <strong>Nota:</strong> El alta se realiza únicamente para el rol <strong>Empleado</strong>. Las cuentas
                de Administrador son gestionadas por el sistema.
            </div>

            <form id="form-registro">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan" required>
                    <p id="error-nombre" class="error-campo"></p>
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej. Pérez" required>
                    <p id="error-apellido" class="error-campo"></p>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                    <p id="error-email" class="error-campo"></p>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
                    <p id="error-password" class="error-campo"></p>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required
                        minlength="6">
                    <p id="error-confirm" class="error-campo"></p>
                </div>

                <button type="submit" class="btn btn-primary">Crear cuenta</button>
                <p id="exito-registro" class="exito-registro"></p>
            </form>

            <section class="login-redirect-section">
                <p>¿Ya tenés una cuenta?</p>
                <a href="login.html" class="btn-login-link">Iniciar sesión</a>
            </section>

        </section>

    </main>

    <script src="assets/js/datos.js"></script>
    <script src="assets/js/registro.js"></script>
</body>

</html>
