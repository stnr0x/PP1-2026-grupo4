<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu menu semanal</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

<button id ="menu-toggle" class="hamburger">☰</button>
<div class="top-bar-right">
    <span class="welcome">Bienvenido, Juan</span>
    <button id="logout-btn" class="butn-logout">Cerrar sesion</button>
</div>

<main>
    <h1>Selecciona tu menu semanal</h1>
    <div class="alerta-asistencia">
        <p>No configuraste tu asistencia.</p>
        <p>Configura tu asistencia para ver el menu.</p>
        <a href="asistencia.html" class="btn-ir">Ir a asistencia</a>
    </div>
    <div id="lista-platos" class="menu-grid"></div>
    <section class="resumen" id="resumen">
        <h2>Registrar pedido</h2>

        <form id="form-pedido">
            <label for="select-plato">Plato</label>
            <select id="select-plato">
                <option value="">Elegí un plato</option>
                <option value="Milanesa con pure">Milanesa con pure</option>
                <option value="Pastel de papa">Pastel de papa</option>
                <option value="Tortilla de acelga">Tortilla de acelga</option>
                <option value="Matambre de cerdo">Matambre de cerdo</option>
            </select>

            <label for="input-cantidad">Cantidad</label>
            <input type="number" id="input-cantidad" min="1" value="1">

            <p id="error-pedido"></p>

            <button type="submit" class="btn-guardar">Guardar pedido</button>
        </form>

        <h3>Pedidos registrados</h3>
        <ul id="lista-pedidos"></ul>
    </section>
    <footer>
        <small>© 2026 Sistema de pedidos</small>
    </footer>
</main>
<script src="assets/js/menu.js"></script>
</body>
</html>
