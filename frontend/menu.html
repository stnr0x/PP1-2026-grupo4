<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu menu semanal</title>
    <link rel="stylesheet" href="assets/css/menu.css">
</head>
<body>

<header class="navbar">
    <div class="navbar-inner">
        <div class="navbar-brand">
            <span class="logo">Byte</span>
            <span class="brand-name">Sistema de Pedidos</span>
        </div>

        <nav>
            <ul class="navbar-nav">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="menu.html" class="active">Menú</a></li>
                <li><a href="mis-pedidos.html">Mis Pedidos</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
            </ul>
        </nav>

        <div class="navbar-user">
            <span class="user-name">Juan Pérez</span>
            <a href="login.html" class="btn-logout">Cerrar sesión</a>
        </div>
    </div>
</header>

<main>
    <h1>Armá tu pedido semanal</h1>
<form id="form-pedido">

<section class="paso">
    <h2>Configura tu asistencia</h2>
<p class="semana-pedido">Pedido para la semana del <strong id="semana-pedido"></strong></p>

    <div class="dias">
        <label class="dia-check"><input type="checkbox" name="dia" value="lunes"> Lunes</label>
        <label class="dia-check"><input type="checkbox" name="dia" value="martes"> Martes</label>
        <label class="dia-check"><input type="checkbox" name="dia" value="miercoles"> Miércoles</label>
        <label class="dia-check"><input type="checkbox" name="dia" value="jueves"> Jueves</label>
        <label class="dia-check"><input type="checkbox" name="dia" value="viernes"> Viernes</label>
        <label class="dia-check"><input type="checkbox" name="dia" value="sabado"> Sábado</label>
    </div>
</section>

 <section class="paso">
        <h2>Elegí tu plato para cada día</h2>
        <div id="lista-platos"></div>
 </section>

 <section class="paso resumen">
        <h2>3. Tu pedido</h2>
        <div id="resumen-pedido"></div>
        <p id="error-pedido"></p>
        <button type="submit" class="btn-guardar">Guardar pedido</button>
 </section>

 <section class="resumen">
        <h3>Pedidos registrados</h3>
        <ul id="lista-pedidos"></ul>
 </section>

 <footer>
        <small>© 2026 Byte — Sistema de Pedidos de Almuerzo</small>
 </footer>

</main>
<script src="assets/js/menu.js"></script>
</body>
</html>
