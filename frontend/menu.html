<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu menu semanal</title>
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/menu.css">
</head>
<body>

<header id="navbar" class="navbar"></header> <!-- la arma assets/js/navbar.js -->

<main>
    <h1>Armá tu pedido semanal</h1>
<form id="form-pedido">

<section class="paso">
    <h2>Tus días de asistencia</h2>
    <p class="semana-pedido">Pedido para la semana del <strong id="semana-pedido"></strong></p>

    <!-- panel para elegir los dias (se ve al entrar y al tocar Modificar) -->
    <div id="panel-asistencia">
        <div class="dias">
            <label class="dia-check"><input type="checkbox" name="dia" value="lunes"> Lunes</label>
            <label class="dia-check"><input type="checkbox" name="dia" value="martes"> Martes</label>
            <label class="dia-check"><input type="checkbox" name="dia" value="miercoles"> Miércoles</label>
            <label class="dia-check"><input type="checkbox" name="dia" value="jueves"> Jueves</label>
            <label class="dia-check"><input type="checkbox" name="dia" value="viernes"> Viernes</label>
            <label class="dia-check"><input type="checkbox" name="dia" value="sabado"> Sábado</label>
        </div>
        <p id="error-asistencia"></p>
        <button type="button" id="btn-guardar-asistencia" class="btn-asistencia">Guardar asistencia</button>
    </div>

    <!-- leyenda chica (se ve despues de guardar) -->
    <div id="resumen-asistencia" class="resumen-asistencia oculto">
        <p>Venís: <strong id="dias-asistencia"></strong></p>
        <button type="button" id="btn-modificar-asistencia" class="btn-secundario">Modificar asistencia</button>
    </div>
</section>

  <!-- bloque para elegir y guardar (se esconde cuando ya hay pedido) -->
 <div id="bloque-pedido">
     <section class="paso">
            <h2>Elegí tu plato para cada día</h2>
            <p id="leyenda-plazo" class="leyenda-plazo"></p>
            <div id="lista-platos"></div>
     </section>

     <section class="paso resumen" id="seccion-resumen">
            <h2>Resumen del pedido</h2>
            <div id="resumen-pedido"></div>
            <p id="error-pedido"></p>
            <button type="submit" id="btn-guardar-pedido" class="btn-guardar">Guardar pedido</button>
     </section>
 </div>

</form>

 <!-- tarjeta que se ve cuando ya hay pedido para la semana -->
 <section id="pedido-hecho" class="pedido-hecho oculto"></section>

 <footer>
        <small>© 2026 Byte — Sistema de Pedidos de Almuerzo</small>
 </footer>

</main>
<script src="assets/js/datos.js"></script>
<script src="assets/js/navbar.js"></script>
<script src="assets/js/menu.js"></script>
</body>
</html>
