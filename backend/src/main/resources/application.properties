spring.application.name=pedidos
spring.datasource.url=jdbc:mysql://localhost:3306/pp1_pedidos
spring.datasource.username=root
# La clave real NUNCA va en el repo: se lee de la variable de entorno DB_PASSWORD.
# (En XAMPP root no tiene clave: DB_PASSWORD queda vacia.)
spring.datasource.password=${DB_PASSWORD:cambiar}
# El script manda: Spring solo controla que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Tiempo en Argentina (para el plazo de los pedidos)
spring.jackson.time-zone=America/Argentina/Buenos_Aires
